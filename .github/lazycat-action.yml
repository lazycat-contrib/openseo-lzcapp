version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  sync_homepage: true
  sync_license: true
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: runtime

images:
  - id: runtime
    target: service
    service: runtime
    source: ghcr.io/every-app/open-seo-standalone
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

  # crawl-gateway 与 runtime 使用同一上游镜像，必须跟随同一版本更新。
  # 该条目不驱动版本号（version_source 只指向 runtime），仅同步镜像引用。
  - id: crawl-gateway
    target: service
    service: crawl-gateway
    source: ghcr.io/every-app/open-seo-standalone
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

build:
  run_buildscript: false
  toolchains: []

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: OpenSEO
