params:
  - id: dataforseo_api_key
    type: string
    name: "DataForSEO API Key"
    description: "Base64-encoded login:password for keyword, backlink, rank and site data. Leave empty to configure later in app settings."
    optional: true
    default_value: ""

  - id: treg_api_token
    type: string
    name: "treg API Token"
    description: "Optional alternative to DataForSEO: the same data bought per call through treg.to."
    optional: true
    default_value: ""

  - id: openrouter_api_key
    type: string
    name: "OpenRouter API Key"
    description: "For SAM conversations, website research and AI summaries. Leave empty to configure later in app settings."
    optional: true
    default_value: ""

  - id: openrouter_base_url
    type: string
    name: "OpenRouter Base URL"
    description: "Optional base URL of another OpenAI-compatible server (vLLM, LiteLLM, Ollama). Leave empty for OpenRouter."
    optional: true
    default_value: ""

  - id: openrouter_model
    type: string
    name: "OpenRouter Model"
    description: "Optional model override for the configured provider."
    optional: true
    default_value: ""

  - id: google_client_id
    type: string
    name: "Google OAuth Client ID"
    description: "Optional, for Search Console and Analytics linking with your own Google OAuth app."
    optional: true
    default_value: ""

  - id: google_client_secret
    type: secret
    name: "Google OAuth Client Secret"
    description: "Optional, paired with the Google OAuth Client ID."
    optional: true
    default_value: ""

  - id: context_api_key
    type: string
    name: "Context API Key"
    description: "Optional JavaScript rendering for site audits."
    optional: true
    default_value: ""

  - id: google_maps_api_key
    type: string
    name: "Google Maps API Key"
    description: "Optional map for Local SEO."
    optional: true
    default_value: ""

  - id: crawler_access_secret
    type: secret
    name: "Crawler Access Secret"
    description: "Optional, at least 32 random characters. Encrypts saved Shopify crawler signatures for site audits."
    optional: true
    default_value: ""

locales:
